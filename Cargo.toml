[package]
name = "model1"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = ["burn/wgpu"]
cpu = ["burn/ndarray"]

[dependencies]
ninjask = { path = "../Ninjask" }
rl4burn = { git = "https://github.com/RPP1011/rl4burn", branch = "master" }
burn = { version = "0.20", default-features = false, features = ["std", "autodiff"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3

